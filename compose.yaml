
services:
  app:
    build: .
    environment:
      APP_NAME: "CENG413 HW-2 App"
      PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COUNTER_KEY: "hw2:counter"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis_data:
  